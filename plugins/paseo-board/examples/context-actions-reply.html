<div id="reply-content">
  <h2>在画布上，直接聊。</h2>
  <p class="hint"><strong>Option / Alt + 拖动</strong>框选，松开后就在鼠标旁边选择「提问」「修改这里」或「开 fork」。</p>
  <p class="hint"><strong>直接右键</strong>引用当前位置；在已有文字或区域选区内右键，就围绕选中的内容交流。</p>
  <p class="muted">选好动作即可输入。Esc 取消选区；输入框保留原生右键菜单，其他位置可用 Shift + 右键打开原生菜单。曲线、速度和你的草稿继续保留。</p>
</div>
