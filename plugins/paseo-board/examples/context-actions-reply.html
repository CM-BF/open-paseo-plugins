<div id="reply-content">
  <h2>在画布上，直接聊。</h2>
  <p class="hint"><strong>右键、选中文字，或 Option / Alt + 拖动框选</strong>后，直接在鼠标旁输入。</p>
  <p class="hint"><strong>Enter</strong>发给当前会话；<strong>⌘ / Ctrl + Enter</strong>新开 Fork。Fork 隔开聊天上下文，也能直接修改同一张 Board。</p>
  <p class="muted">Shift + Enter 换行，点击框外或 Esc 关闭。输入框保留原生右键菜单，其他位置可用 Shift + 右键打开原生菜单。曲线、速度和你的草稿继续保留。</p>
</div>
