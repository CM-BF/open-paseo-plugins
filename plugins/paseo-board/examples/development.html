<style>
*{box-sizing:border-box}.board-main{max-width:1100px;margin:auto;padding:44px 44px 70px;font-family:system-ui,sans-serif;color:var(--host-ink)}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--host-ink-3);text-transform:uppercase}.intro{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid var(--host-line);padding-bottom:28px}h1{font-size:clamp(30px,4.5vw,54px);line-height:1.1;font-weight:550;letter-spacing:-.05em;margin:18px 0}p{line-height:1.7;color:var(--host-ink-3);font-size:14px}.tag{font-size:12px;color:var(--host-iris-ink);white-space:nowrap}.flow{margin:38px 0 20px;background:var(--host-raised);border:1px solid var(--host-line);border-radius:12px;padding:20px}.flow svg{width:100%;height:170px;overflow:visible}.flow text{fill:var(--host-ink);font-size:13px}.controls{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--host-ink-3)}button{font:inherit;border:1px solid var(--host-line);border-radius:6px;background:transparent;color:var(--host-ink);padding:8px 12px;cursor:pointer}button:hover{border-color:var(--host-iris)}input[type=range]{accent-color:var(--host-iris)}.sections{display:grid;grid-template-columns:1.05fr 1fr;gap:50px;margin-top:35px}.sections h2{font-size:21px;font-weight:500;letter-spacing:-.02em}.checks{padding:0;list-style:none}.checks li{padding:12px 0;border-bottom:1px solid var(--host-line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}.state{font-size:11px;color:var(--host-iris-ink)}.note{font-size:12px;color:var(--host-ink-3)}.live{display:flex;gap:8px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:var(--host-iris)}#response-space{min-height:80px;border:1px dashed var(--host-line);border-radius:8px;padding:18px;margin-top:25px}.pulse{fill:var(--host-iris)}@media(max-width:650px){.board-main{padding:24px}.intro{display:block}.sections{grid-template-columns:1fr;gap:20px}.flow{padding:12px}.flow text{font-size:12px}}
</style>
<main class="board-main">
<header class="intro"><div><div class="eyebrow">Paseo Board / Development</div><h1>交流，发生在内容上。</h1><p>这块画布本身就是 agent 自由编写的页面。<br>这里的内容可以不断变化，提问和决策由外层插件保留。</p></div><div class="tag live"><span class="dot"></span><span id="phase">开发验证中</span></div></header>
<section class="flow" id="interaction-loop" aria-label="交互闭环动画">
<svg viewBox="0 0 900 160" role="img" aria-label="用户指向内容，agent解释或修改，画布持续更新">
<path id="route" d="M90 70 L330 70 L570 70 L810 70" stroke="var(--host-line-strong)" stroke-width="1.5" fill="none"/>
<g><circle cx="90" cy="70" r="27" fill="var(--host-sheet)" stroke="var(--host-line-strong)"/><text x="90" y="75" text-anchor="middle">你</text><text x="90" y="129" text-anchor="middle">指着内容提问</text></g>
<g><circle cx="330" cy="70" r="27" fill="var(--host-sheet)" stroke="var(--host-line-strong)"/><text x="330" y="75" text-anchor="middle">引用</text><text x="330" y="129" text-anchor="middle">画面 · 位置 · 版本</text></g>
<g><circle cx="570" cy="70" r="27" fill="var(--host-sheet)" stroke="var(--host-line-strong)"/><text x="570" y="75" text-anchor="middle">Agent</text><text x="570" y="129" text-anchor="middle">解释或局部修改</text></g>
<g><circle cx="810" cy="70" r="27" fill="var(--host-sheet)" stroke="var(--host-line-strong)"/><text x="810" y="75" text-anchor="middle">画布</text><text x="810" y="129" text-anchor="middle">结果回到原位置</text></g><circle id="pulse" class="pulse" cx="90" cy="70" r="4"/>
</svg>
<div class="controls"><button id="pause">暂停动画</button><label for="speed">速度</label><input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1"><span id="speed-value">1×</span><span>这是交互原理动画，非真实消息流。</span></div>
</section>
<div class="sections"><section id="validation"><div class="eyebrow">Implementation</div><h2>当前进展</h2><ul class="checks" id="checks"></ul><p class="note live"><span class="dot"></span><span id="event-status">等待后台事件</span></p></section><section id="freedom"><div class="eyebrow">Open canvas</div><h2>表达方式由 agent 决定</h2><p>图表、动画、模拟器、文档或一个新的交互组件，都可以放到这里。插件保留的是指向内容的交流方式，以及 agent 做过的默认选择。</p><button id="explain">让 agent 解释局部更新</button><div id="response-space"><p class="note">可以使用上方“指定位置”，让 agent 在这里增加一段解释或动画。</p></div><p id="receipt" class="note" aria-live="polite"></p></section></div>
</main>
<script>
(() => {
 const saved=board.getState();const speed=document.getElementById('speed');const label=document.getElementById('speed-value');const pause=document.getElementById('pause');const pulse=document.getElementById('pulse');let paused=!!saved.paused;let progress=0;let last=performance.now();
 speed.value=String(saved.speed||1);
 function persist(){label.textContent=speed.value+'×';pause.textContent=paused?'继续动画':'暂停动画';board.saveState({speed:Number(speed.value),paused});}
 speed.oninput=persist;pause.onclick=()=>{paused=!paused;persist();};label.textContent=speed.value+'×';pause.textContent=paused?'继续动画':'暂停动画';
 function animate(now){if(!paused)progress=(progress+(now-last)*.00012*Number(speed.value))%1;pulse.setAttribute('cx',String(90+720*progress));last=now;requestAnimationFrame(animate);}requestAnimationFrame(animate);
 function render(data){document.getElementById('phase').textContent=data.phase||'开发验证中';document.getElementById('event-status').textContent=data.eventStatus||'等待后台事件';const items=data.checks||[];document.getElementById('checks').replaceChildren(...items.map(item=>{const li=document.createElement('li');const title=document.createElement('span');title.textContent=item.label;const state=document.createElement('span');state.className='state';state.textContent=item.status;li.append(title,state);return li;}));}
 render(board.getData());board.onData(render);
 document.getElementById('explain').onclick=async()=>{const result=await board.ask({kind:'question',prompt:'请在 #response-space 添加一个可交互的小例子，解释为什么局部更新不会重置别处的输入或动画。保留当前动画与速度设置。'});document.getElementById('receipt').textContent=result.status==='submitted'?'已提交。结果会回到这块画布。':'未发送。';};
})();
</script>
